services:
  backend:
    env_file:
      - path: .env
        required: false
    build:
      context: ./backend
      args:
        INSTALL_KNOWLEDGE: ${QIWEN_INSTALL_KNOWLEDGE:-false}
    environment:
      QIWEN_ENV: ${QIWEN_ENV:-development}
      QIWEN_SECRET_KEY: ${QIWEN_SECRET_KEY:-}
      QIWEN_CORS_ORIGINS: ${QIWEN_CORS_ORIGINS:-http://localhost:23000,http://127.0.0.1:23000}
      QIWEN_DATA_DIR: /app/.data
      QIWEN_MODEL_MODE: ${QIWEN_MODEL_MODE:-mock}
      QIWEN_MODEL_BASE_URL: ${QIWEN_MODEL_BASE_URL:-}
      QIWEN_MODEL_API_KEY: ${QIWEN_MODEL_API_KEY:-}
      QIWEN_MODEL_NAME: ${QIWEN_MODEL_NAME:-}
      QIWEN_RAG_MODE: ${QIWEN_RAG_MODE:-mock}
      QIWEN_EMBEDDING_MODEL: ${QIWEN_EMBEDDING_MODEL:-}
    volumes:
      - qiwen_data:/app/.data
    expose:
      - "8000"
    init: true

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${QIWEN_WEB_PORT:-23000}:3000"
    init: true

  mcp:
    profiles: [mcp]
    build:
      context: ./backend
      args:
        INSTALL_TOOLS: "true"
        INSTALL_KNOWLEDGE: ${QIWEN_INSTALL_KNOWLEDGE:-false}
    env_file:
      - path: .env
        required: false
    environment:
      QIWEN_ENV: ${QIWEN_ENV:-development}
      QIWEN_SECRET_KEY: ${QIWEN_SECRET_KEY:-}
      QIWEN_DATA_DIR: /app/.data
      QIWEN_MCP_ISSUER_URL: ${QIWEN_MCP_ISSUER_URL:-http://127.0.0.1:23000}
      QIWEN_MCP_RESOURCE_URL: ${QIWEN_MCP_RESOURCE_URL:-http://127.0.0.1:28001/mcp}
    command: [python, -m, app.mcp_server, --transport, streamable-http, --host, "0.0.0.0", --port, "28001"]
    volumes:
      - qiwen_data:/app/.data
    ports:
      - "127.0.0.1:28001:28001"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    healthcheck:
      test: [CMD, python, -c, "import http.client; c=http.client.HTTPConnection('127.0.0.1',28001,timeout=2); c.request('POST','/mcp'); assert c.getresponse().status == 401"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

volumes:
  qiwen_data:
